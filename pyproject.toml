[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guide_utils"
version = "0.1.0"
description = "Helpers for the deep learning and robotics guide notebooks"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "scikit-learn", "scipy", "huggingface_hub", "pillow"]

[tool.setuptools]
packages = ["guide_utils"]
